name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            output: whats-spoofing-linux
          - os: windows
            goos: windows
            goarch: amd64
            output: whats-spoofing-windows.exe

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build -v -o ${{ matrix.output }} .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whats-spoofing-${{ matrix.os }}
        path: ${{ matrix.output }}

  release:
    name: Update Nightly Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: whats-spoofing-*
          merge-multiple: true

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: "Latest nightly build from main branch."
          prerelease: true
          files: |
            whats-spoofing-linux
            whats-spoofing-windows.exe


